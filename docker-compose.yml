services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ums-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Your_strong_password123!}"
    ports:
      - "14333:1433"
    volumes:
      - ums-sql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: UMS.Api/Dockerfile.dev
    container_name: ums-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=UMS_AspNetCore;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Your_strong_password123!};Encrypt=False;TrustServerCertificate=True"
      Jwt__Secret: "${JWT_SECRET:-replace-this-development-secret-with-user-secrets}"
      Jwt__Issuer: "UMS.Api"
      Jwt__Audience: "UMS.Frontend"
      MigrateDatabaseOnStartup: "true"
    ports:
      - "5219:8080"
    volumes:
      - ./UMS.Api:/src/UMS.Api
      - ums-api-bin:/src/UMS.Api/bin
      - ums-api-obj:/src/UMS.Api/obj

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ums-frontend
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5219"
      INTERNAL_API_URL: "http://api:8080"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - ums-frontend-node-modules:/app/node_modules
      - ums-frontend-next:/app/.next

volumes:
  ums-sql-data:
  ums-api-bin:
  ums-api-obj:
  ums-frontend-node-modules:
  ums-frontend-next:
